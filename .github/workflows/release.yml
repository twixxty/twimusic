name: Release

# Run manually (Actions -> Release -> Run workflow). Asks for the version name and the changelog,
# builds signed release APKs for arm64-v8a, armeabi-v7a, x86_64 and a universal APK, and publishes a
# GitHub Release with the changelog as its notes. The in-app updater picks the right APK for the phone.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 1.3.3)"
        required: true
        type: string
      changelog:
        description: "Changelog (release notes)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_VERSION_NAME: ${{ inputs.version_name }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      # Signing falls back to signing/release.keystore with the defaults in app/build.gradle.kts
      # when these secrets are not set.
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          # The action only knows wrapper jars up to the version it was released with, and rejects
          # the Gradle 9.8.2 wrapper committed here as "unknown". The jar is from this repo, so
          # skip the check rather than failing every release.
          validate-wrappers: false

      - name: Build release APKs (per-ABI + universal)
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Collect and name the APKs
        run: |
          set -euo pipefail
          version="${ANDROID_VERSION_NAME#v}"
          mkdir -p release-apks
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            src=$(ls app/build/outputs/apk/release/*-"$abi"-release*.apk | head -n 1)
            cp "$src" "release-apks/TwiMusic-${version}-${abi}.apk"
          done
          ls -l release-apks

      - name: Write release notes
        env:
          CHANGELOG: ${{ inputs.changelog }}
        run: printf '%s\n' "$CHANGELOG" > release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: TwiMusic-release-apks
          path: release-apks/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          name: TwiMusic ${{ inputs.version_name }}
          body_path: release-notes.md
          files: release-apks/*.apk
