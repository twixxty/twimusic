name: Release

# Builds signed release APKs for every ABI (arm64-v8a, armeabi-v7a, x86_64) plus a universal APK,
# and attaches them to a GitHub Release. Trigger by pushing a tag like v1.2.8, or run manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 1.2.8). Defaults to the tag, or the Gradle default."
        required: false
      version_code:
        description: "Version code. Defaults to the run number."
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_VERSION_CODE: ${{ inputs.version_code || github.run_number }}
      # Signing falls back to signing/release.keystore with the defaults in app/build.gradle.kts
      # when these secrets are not set.
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # Only export ANDROID_VERSION_NAME when there is one: an empty value would override the
      # Gradle default with a blank version name.
      - name: Resolve version name
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then version="$GITHUB_REF_NAME"; fi
          version="${version#v}"
          if [ -n "$version" ]; then echo "ANDROID_VERSION_NAME=$version" >> "$GITHUB_ENV"; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs (per-ABI + universal)
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Collect and name the APKs
        id: apks
        run: |
          set -euo pipefail
          out=release-apks
          mkdir -p "$out"
          version="${ANDROID_VERSION_NAME:-dev}"
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            src=$(ls app/build/outputs/apk/release/*-"$abi"-release*.apk | head -n 1)
            cp "$src" "$out/TwiMusic-${version}-${abi}.apk"
          done
          ls -l "$out"
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: TwiMusic-release-apks
          path: release-apks/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
          generate_release_notes: true
